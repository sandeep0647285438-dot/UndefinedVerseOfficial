
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UV AI Connection Test</title>
  <style>
    body {
      max-width: 650px;
      margin: 40px auto;
      padding: 20px;
      font: 16px system-ui, sans-serif;
      background: #101019;
      color: #f5f3ff;
    }
    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 8px;
      background: #a78bfa;
      color: #171027;
      font-weight: bold;
    }
    pre {
      padding: 14px;
      border-radius: 8px;
      background: #20202d;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <h1>UV AI Connection Test</h1>
  <p>This temporary page checks whether the AI backend responds.</p>
  <button id="test">Test AI connection</button>
  <pre id="result">Ready to test.</pre>

  <script>
    const WORKER =
      "https://uv-ai-chatbot.sandeep0647285438.workers.dev/chat";

    document.getElementById("test").addEventListener("click", async () => {
      const result = document.getElementById("result");
      const button = document.getElementById("test");

      button.disabled = true;
      result.textContent = "Sending test message...";

      try {
        const response = await fetch(WORKER, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            messages: [{
              role: "user",
              content: "Reply with a short greeting and identify yourself."
            }]
          })
        });

        const data = await response.json();

        result.textContent =
          "HTTP status: " + response.status + "\n\n" +
          JSON.stringify(data, null, 2);
      } catch (error) {
        result.textContent =
          "Request failed: " + error.message +
          "\nCheck the Worker URL and CORS settings.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
