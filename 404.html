
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090810">

  <meta
    name="description"
    content="The requested page could not be found on UndefinedVerseOfficial."
  >

  <title>Page Not Found | UndefinedVerseOfficial</title>

  <style>
    :root {
      color-scheme: dark;
      --background: #090810;
      --surface: #12101c;
      --text: #f0edf7;
      --muted: #a29caf;
      --silver: #d8d3e5;
      --purple: #a78bfa;
      --border: rgba(216, 211, 229, 0.14);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      padding: 24px;
      background:
        radial-gradient(
          ellipse at 50% 38%,
          rgba(105, 70, 160, 0.17),
          transparent 55%
        ),
        var(--background);
      color: var(--text);
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .page {
      width: min(100%, 680px);
      position: relative;
      padding: clamp(28px, 7vw, 64px);
      overflow: hidden;
      text-align: center;
      background: rgba(18, 16, 28, 0.78);
      border: 1px solid var(--border);
      border-radius: 22px;
      animation: appear 700ms ease both;
    }

    .page::before {
      content: "";
      position: absolute;
      top: 0;
      left: 15%;
      right: 15%;
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent,
        var(--purple),
        var(--silver),
        transparent
      );
      opacity: 0.8;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--silver);
      text-decoration: none;
      text-align: left;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      flex-shrink: 0;
    }

    .brand-name {
      display: block;
      font-size: 12px;
      font-weight: 750;
      letter-spacing: 0.16em;
    }

    .brand-caption {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 9px;
      letter-spacing: 0.2em;
    }

    .error-code {
      margin: 48px 0 0;
      color: var(--purple);
      font-size: clamp(76px, 19vw, 132px);
      font-weight: 850;
      line-height: 1;
      letter-spacing: -0.09em;
      text-shadow: 0 0 48px rgba(167, 139, 250, 0.17);
      animation: glow 4s ease-in-out infinite alternate;
    }

    h1 {
      margin: 24px 0 12px;
      font-size: clamp(25px, 5vw, 38px);
      font-weight: 700;
      letter-spacing: -0.045em;
    }

    .description {
      max-width: 410px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.8;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 48px;
      margin-top: 30px;
      padding: 0 22px;
      border: 1px solid rgba(216, 211, 229, 0.25);
      border-radius: 9px;
      background: linear-gradient(
        135deg,
        rgba(167, 139, 250, 0.17),
        rgba(216, 211, 229, 0.06)
      );
      color: var(--text);
      font-size: 14px;
      font-weight: 650;
      text-decoration: none;
      transition:
        transform 200ms ease,
        border-color 200ms ease,
        background 200ms ease;
    }

    .button:hover {
      transform: translateY(-2px);
      border-color: var(--purple);
      background: rgba(167, 139, 250, 0.13);
    }

    .button:focus-visible,
    .brand:focus-visible {
      outline: 2px solid var(--purple);
      outline-offset: 5px;
    }

    .footer {
      margin-top: 46px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.04em;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 24px rgba(167, 139, 250, 0.12);
      }
      to {
        text-shadow: 0 0 50px rgba(167, 139, 250, 0.3);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <a class="brand" href="./" aria-label="UndefinedVerseOfficial home">
      <svg
        class="brand-mark"
        viewBox="0 0 48 48"
        aria-hidden="true"
      >
        <path
          d="M8 8H19V28C19 33 21 36 24 36C27 36 29 33 29 28V8H40V29C40 40 33 44 24 44C15 44 8 40 8 29Z"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        />
        <path
          d="M8 8L24 22L40 8"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          opacity=".65"
        />
      </svg>

      <span>
        <span class="brand-name">UNDEFINEDVERSE</span>
        <span class="brand-caption">OFFICIAL PROJECT</span>
      </span>
    </a>

    <p class="error-code" aria-label="Error 404">404</p>

    <h1>Page not found.</h1>

    <p class="description">
      The page you're looking for doesn't exist or may have moved.
      Check the address or return to the main website.
    </p>

    <a class="button" href="./">
      <span aria-hidden="true">←</span>
      Return to home
    </a>

    <p class="footer">
      UNDEFINEDVERSEOFFICIAL · INDEPENDENT CREATIVE PROJECT
    </p>
  </main>
</body>
</html>
